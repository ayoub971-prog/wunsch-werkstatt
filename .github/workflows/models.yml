name: Gratis-Modelle aktualisieren
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/refresh_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      - run: |
          if ! git diff --quiet models.json; then
            git -c user.name=ayoub971-prog -c user.email=ayoub971-prog@users.noreply.github.com commit -am "Gratis-Modelle aktualisiert" && git push
          fi
